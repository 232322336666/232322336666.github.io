chips:
  - id: esserc-2026
    title: 32-Channel Brain–Machine Interface SoC
    description: Dual-threshold delta modulation, in-memory spike detection, and bidirectional spiking neural network decoding at 3.53 µW per channel.
    image: /assets/img/projects/esserc2026-die.jpg
    alt: Die micrograph of the 32-channel brain–machine interface SoC
    width: 1313
    height: 1751
    links:
      - label: ESSERC 2026 paper
        url: https://arxiv.org/abs/2606.01776
      - label: Full-size die image
        url: /assets/img/projects/esserc2026-die.jpg

  - id: nonlinear-analog-cim
    title: Nonlinear Analog Computing-in-Memory Macro
    description: A 65 nm CMOS macro for multi-bit LSTM acceleration with an energy efficiency of 33.6–136.2 TOPS/W.
    image: /assets/img/publication_preview/JSSC.jpg
    alt: Preview of the nonlinear analog computing-in-memory paper
    width: 345
    height: 146
    links:
      - label: IEEE JSSC paper
        url: https://doi.org/10.1109/JSSC.2025.3638445

  - id: sar-adc
    title: 14-Bit SAR ADC Chip Design
    image: /assets/img/projects/adc.png
    alt: 14-bit SAR ADC chip design
    width: 1930
    height: 1365

  - id: infrared-roic
    title: Digital Readout IC for Infrared Focal-Plane Arrays
    image: /assets/img/projects/readout.png
    alt: PCB layout for the infrared focal-plane array digital readout IC
    width: 962
    height: 847
    links:
      - label: IEEE Sensors Letters paper
        url: https://doi.org/10.1109/LSENS.2023.3290983

